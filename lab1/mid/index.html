<!DOCTYPE html>
<html>
<style>
* {
    margin: 0;
    padding: 0;
}
body {
    background-color: black;
    color: white;
}
a:visited {
    color:inherit;
}
p {
    margin: 10px 0px;
}
h1 {
    font-weight: normal;
    margin: 10px 0px;
}
ol, ul, li {
    list-style-position: inside; 
}
ul, ul li {
    list-style-type: disc;
}
.nav, .nav li {
    list-style: none;
    margin: 0px;
}
nav {
    float: left;
    width: 200px;
}
article, section {
    margin: 10px;
    padding: 10px;
}
section {
    background-color: #070607;
}
article {
    background-color: #121013;
}
</style>
<head>
    <title>Любимый рецепт</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<main>
    <h1 style="margin-left: 10px"><strong>Мой любимый рецепт</strong></h1>
    <section>
        <article>
            <h1><strong>Название блюда</strong></h1>
            <img src="img.img" alt="изображение готового блюда">
            <h2>Описание</h2>
            <p style="margin-bottom: 0;">...</p>
        </article>
        <article>
            <h2>Ингридиенты</h2>
            <ul>
                <li>первый</li>
                <li>второй</li>
                <li>третий</li>
                <li>четвертый</li>
            </ul>
        </article>
        <article>
            <h2>Рецепт</h2>
            <ol>
                <li>первый</li>
                <li>второй</li>
                <li>третий</li>
                <li>четвертый</li>
            </ol>
        </article>
        <article>
            <h2>Советы</h2>
            <ol>
                <li>первый</li>
                <li>второй</li>
                <li>третий</li>
                <li>четвертый</li>
            </ol>
        </article>
        <article>
            <h2>История</h2>
            <p>Итория блюда...</p>
        </article>
        <article>
            <h2>Подача</h2>
            <p>Блюдо подают...</p>
        </article>
    </section>
</main>
</body>
</html>
